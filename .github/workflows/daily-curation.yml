# 매일 아침 큐레이션 에이전트를 실행하는 워크플로우.
#
# Claude Code GitHub Action(anthropics/claude-code-action)을 사용해
# docs/AGENT.md 의 절차대로 콘텐츠를 수집·작성·검증·커밋합니다.
# 사용하려면 리포지토리 시크릿에 ANTHROPIC_API_KEY 를 등록하세요.
name: Daily Curation

on:
  schedule:
    # 매일 07:30 KST (22:30 UTC)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run curation agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            docs/AGENT.md 와 docs/WRITING.md 를 읽고 그 절차와 품질 기준을 따라
            오늘의 데일리 큐레이션을 게시해줘.

            1. npm run sources:check -- --days 2 로 등록된 해외 소스
               (config/sources.json)의 새 글을 확인한다. "수동 확인 필요"
               소스는 홈 URL을 직접 방문한다.
            2. 후보 중 디자이너에게 가장 유용한 3~5건을 골라 원문을 읽고,
               WRITING.md 기준(구조 템플릿, 임베드, 문체)으로 한국어 아티클을
               작성한다. 이미 다룬 소식([게시됨] 표시)은 제외한다.
            3. 국내 디자이너 채용 공고를 조사해서 오늘 날짜의 jobs JSON을
               작성한다. (기존 content/jobs/ 의 id와 중복 금지)
            4. npm run validate 로 검증하고, 통과하면 content/ 만 커밋 후
               main에 푸시한다. 실패하면 고쳐서 다시 검증한다.
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
