name: Slack Daily Digest

on:
  schedule:
    # 매일 10:00 KST (01:00 UTC)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "수동 테스트에 포함할 최근 게시일 수"
        required: false
        default: "1"
        type: string
      slugs:
        description: "특정 글만 재발송할 query string (예: slug=a&slug=b)"
        required: false
        default: ""
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send digest through the Slack Bot API
        env:
          CRIT_SLACK_CRON_SECRET: ${{ format('{0}', secrets.SLACK_CRON_SECRET) }}
          CRIT_SLACK_SLUG_QUERY: ${{ inputs.slugs || '' }}
        run: >-
          QUERY="${CRIT_SLACK_SLUG_QUERY:-days=${{ inputs.days || '1' }}}" &&
          curl --fail-with-body --silent --show-error
          -X POST "https://crit.day/api/slack/digest?$QUERY"
          -H "Authorization: Bearer $CRIT_SLACK_CRON_SECRET"
