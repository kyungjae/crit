name: Slack Daily Digest

on:
  schedule:
    # 매일 10:00 KST (01:00 UTC)
    - cron: "0 1 * * *"
  push:
    branches: [main]
    paths:
      - "content/articles/**"
  workflow_dispatch:
    inputs:
      query:
        description: "운영자용 query string (예: slug=a&slug=b 또는 baseline=current)"
        required: false
        default: ""
        type: string

concurrency:
  group: slack-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send digest through the Slack Bot API
        env:
          CRIT_SLACK_CRON_SECRET: ${{ format('{0}', secrets.SLACK_CRON_SECRET) }}
          CRIT_SLACK_QUERY: ${{ inputs.query || '' }}
        run: |
          set -euo pipefail
          query="${CRIT_SLACK_QUERY}"
          url="https://crit.day/api/slack/digest${query:+?$query}"
          attempts=1
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            attempts=8
          fi

          failed=0
          for attempt in $(seq 1 "$attempts"); do
            if ! curl --fail-with-body --silent --show-error \
              -X POST "$url" \
              -H "Authorization: Bearer $CRIT_SLACK_CRON_SECRET"; then
              failed=1
            fi
            if [[ "$attempt" -lt "$attempts" ]]; then
              sleep 30
            fi
          done
          exit "$failed"
